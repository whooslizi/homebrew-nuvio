name: Update Nuvio cask

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - ".github/workflows/autobrew.yml"
      - ".github/scripts/update-cask.sh"
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even if up to date
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask
        run: bash .github/scripts/update-cask.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'push' || inputs.force }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nuvio.rb
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          VERSION="$(sed -nE 's/^  version "([^"]+)"/\1/p' Casks/nuvio.rb)"
          git commit -m "nuvio $VERSION"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push failed, retry $i/5 in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1
